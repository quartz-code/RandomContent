name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/Pulse-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/Pulse-arm32.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pulse 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Сборка из ветки `${{ github.ref_name }}` (${{ github.sha }}).
            Почти всем телефонам нужен **Pulse-arm64.apk**. Pulse-arm32.apk — только для очень старых устройств.
          files: dist/*.apk
