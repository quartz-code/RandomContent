name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # izzy flavor: no Google Cast and no updater that would offer the official Metrolist.
      - name: Build release APK
        run: ./gradlew :app:assembleIzzyRelease --no-daemon --console=plain
        env:
          METROLIST_BUILD_COMMIT: ${{ github.sha }}

      - name: Collect APK
        run: |
          mkdir dist
          cp "$(ls app/build/outputs/apk/izzy/release/*.apk | head -n1)" dist/Pulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: dist/Pulse.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pulse (Metrolist) ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Сборка из ветки `${{ github.ref_name }}` (${{ github.sha }}).
            Скачай **Pulse.apk** и установи.
          files: dist/Pulse.apk
